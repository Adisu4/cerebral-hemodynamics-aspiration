[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebral-hemodynamics-aspiration"
version = "0.3.1"
description = "Lumped-parameter model of cerebral hemodynamics during controlled venous aspiration"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [
  {name = "Adisu Mengesha Assefa"},
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
visualization = ["matplotlib>=3.8,<4"]

[project.scripts]
cerebral-hemodynamics-run = "cerebral_hemodynamics_aspiration.experiments:cli"
cerebral-hemodynamics-plot = "cerebral_hemodynamics_aspiration.figures:cli"

[project.urls]
Repository = "https://github.com/Adisu4/cerebral-hemodynamics-aspiration"
Issues = "https://github.com/Adisu4/cerebral-hemodynamics-aspiration/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
