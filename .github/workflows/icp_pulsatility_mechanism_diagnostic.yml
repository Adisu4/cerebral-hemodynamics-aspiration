name: ICP pulsatility mechanism diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/icp_pulsatility_mechanism_diagnostic.py"
      - ".github/workflows/icp_pulsatility_mechanism_diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download CHARIS1
        run: |
          mkdir -p external_data results/icp_pulsatility_diagnostic
          curl -L --fail --retry 5 -o external_data/charis1.dat "https://physionet.org/files/charisdb/1.0.0/charis1.dat"
      - name: Run mechanism diagnostic
        run: |
          python analysis/icp_pulsatility_mechanism_diagnostic.py --charis-dat external_data/charis1.dat --output-dir results/icp_pulsatility_diagnostic
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icp-pulsatility-mechanism-diagnostic
          path: results/icp_pulsatility_diagnostic/
          if-no-files-found: error
          retention-days: 14
