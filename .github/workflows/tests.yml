name: tests

on:
  push:
  pull_request:

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: cerebral-hemodynamics-run --help

  distribution-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install -r requirements-reproduction.txt pytest==9.1.1
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pytest
      - run: cerebral-hemodynamics-run --help
      - name: Check source distribution contents
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(archive, "r:gz") as handle:
              names = handle.getnames()
          required_suffixes = (
              "tests/reference/source_manifest.json",
              "data/study_manifest.json",
              "docs/model_scope.md",
              "tests/test_reference_implementation.py",
          )
          for suffix in required_suffixes:
              assert any(name.endswith(suffix) for name in names), suffix
          PY
