name: CONTRAST pulsatility pilot

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/contrast_pulsatility_pilot.py"
      - ".github/workflows/contrast_pulsatility_pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download CONTRAST archive
        run: |
          mkdir -p external_data results/contrast_pulsatility_pilot
          curl -L --fail --retry 5 --retry-delay 5 -o external_data/CONTRAST.tgz "https://zenodo.org/records/4992130/files/CONTRAST.tgz?download=1"
          echo "72908ccf181fb10206e1142cdf7dccb7  external_data/CONTRAST.tgz" | md5sum -c -
      - name: Run isolated two-condition pilot
        run: |
          python analysis/contrast_pulsatility_pilot.py --archive external_data/CONTRAST.tgz --output-dir results/contrast_pulsatility_pilot
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-pulsatility-pilot
          path: results/contrast_pulsatility_pilot/
          if-no-files-found: error
          retention-days: 14
