name: CHARIS waveform validation pilot

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/charis1_waveform_validation.py"
      - ".github/workflows/charis1_waveform_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download CHARIS1
        run: |
          mkdir -p external_data results/charis1_validation
          curl -L --fail --retry 5 --retry-delay 5 -o external_data/charis1.dat "https://physionet.org/files/charisdb/1.0.0/charis1.dat"
          curl -L --fail --retry 5 --retry-delay 5 -o external_data/charis1.hea "https://physionet.org/files/charisdb/1.0.0/charis1.hea"
          ls -lh external_data/charis1.*
      - name: Run CHARIS validation and aspiration pilot
        run: |
          python analysis/charis1_waveform_validation.py --dat external_data/charis1.dat --output-dir results/charis1_validation
      - name: Upload CHARIS outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charis1-waveform-validation
          path: results/charis1_validation/
          if-no-files-found: error
          retention-days: 14
